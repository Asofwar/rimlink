syntax = "proto3";

package rimlink.v1;
option csharp_namespace = "Rimlink.Protocol.V1";

import "google/protobuf/timestamp.proto";
import "common.proto";
import "world.proto";
import "saves.proto";
import "chat.proto";
import "economy.proto";
import "raids.proto";
import "live.proto";
import "visits.proto";

// One server-push stream per session; everything that changes arrives here.
service Events {
  rpc Subscribe (Empty) returns (stream ServerEvent);
}

message ServerEvent {
  int64 sequence = 1;
  google.protobuf.Timestamp at = 2;
  oneof body {
    PlayerJoined player_joined = 10;
    PlayerLeft player_left = 11;
    SessionReplaced session_replaced = 12;
    ChatMessageEvent chat = 20;
    WorldObjectAdded world_object_added = 30;
    WorldObjectRemoved world_object_removed = 31;
    Notice notice = 40;
    ServerShutdown shutdown = 41;
    SaveRolledBack save_rolled_back = 42;
    ParcelArrived parcel_arrived = 50;
    LotSold lot_sold = 51;
    LotClosed lot_closed = 52;
    WalletChanged wallet_changed = 53;
    RaidQueued raid_queued = 60;
    RaidLanded raid_landed = 61;
    RaidResolved raid_resolved = 62;
    RaidExpired raid_expired = 63;
    ItemSold item_sold = 64;
    VisitStarted visit_started = 65;
    PlayerFlagsChanged player_flags_changed = 66;
    LiveInvite live_invite = 70;
    LiveStarted live_started = 71;
    LiveEnded live_ended = 72;
    LiveFallback live_fallback = 73;
    LivePeerLost live_peer_lost = 74;
    LivePeerBack live_peer_back = 75;
  }
}

message PlayerJoined { PlayerRef player = 1; }
message PlayerLeft { PlayerRef player = 1; }
// The same account logged in from somewhere else; this session is over.
message SessionReplaced {}
message Notice { string text = 1; }
message ServerShutdown { int32 in_seconds = 1; string reason = 2; }
