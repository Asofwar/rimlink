syntax = "proto3";

package rimlink.v1;
option csharp_namespace = "Rimlink.Protocol.V1";

import "google/protobuf/timestamp.proto";
import "common.proto";
import "outposts.proto";

// Save games are zstd-compressed .rws files, streamed in chunks of at most 1 MB (Limits.SaveChunkBytes).
service Saves {
  // First message must be a header, then data chunks. Fails with SAVE_INVALID when size, hash or content do not match.
  rpc Upload (stream SaveChunk) returns (SaveInfo);
  // Current version: header first, then data chunks. NOT_FOUND when the player has no save.
  rpc Download (Empty) returns (stream SaveChunk);
  rpc List (Empty) returns (SaveVersions);
  // Another player's current save, only while visiting them (Visits.Begin). PERMISSION_DENIED otherwise.
  rpc DownloadOf (PlayerRef) returns (stream SaveChunk);
}

message SaveChunk {
  oneof part {
    SaveHeader header = 1;
    bytes data = 2;
  }
}

message SaveHeader {
  int64 game_tick = 1;
  string world_seed = 2;
  string faction_name = 3;
  // Size and SHA-256 of the compressed payload that follows.
  int64 total_size = 4;
  bytes sha256 = 5;
  // Colony wealth (WealthWatcher) at save time; raid protection and loot caps read them.
  int64 wealth_total = 6;
  int64 wealth_items = 7;
  // Dev mode was on in this game since the previous upload; recorded per version, freezes a player not allowed to use it.
  bool dev_mode = 8;
  // The saved colony's generation, never taken from a newer login for an older file.
  int64 save_generation = 9;
  string snapshot_id = 10;
  int64 save_write_epoch = 11;
  uint32 recovery_version = 12;
  uint32 outpost_version = 13;
  string outpost_restore_boundary = 14;
  bytes raw_sha256 = 15;
  OutpostSaveMetadata outpost_metadata = 16;
  OutpostRollbackBridge outpost_rollback_bridge = 17;
  OutpostRestoreBridge outpost_restore_bridge = 18;
  OutpostRollbackFromViewBridge outpost_rollback_from_view_bridge = 19;
  uint32 guild_version = 20; // Version of nested guild metadata; zero when that family is absent.
}

message SaveInfo {
  int32 version = 1;
  int64 size = 2;
  google.protobuf.Timestamp created_at = 3;
  bool is_current = 4;
  int64 game_tick = 5;
  string snapshot_id = 6;
  int64 save_write_epoch = 7;
  uint32 recovery_version = 8;
  uint32 outpost_version = 9;
  string outpost_restore_boundary = 10;
  bytes raw_sha256 = 11;
}

message SaveVersions {
  repeated SaveInfo versions = 1;
}

// Event body (ServerEvent 42): an admin made another version current; re-login to load it.
message SaveRolledBack { int32 version = 1; int64 save_write_epoch = 2; }
