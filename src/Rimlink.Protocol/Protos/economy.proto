syntax = "proto3";

package rimlink.v1;
option csharp_namespace = "Rimlink.Protocol.V1";

import "google/protobuf/timestamp.proto";
import "common.proto";

// Economy (sub-project 2): wallet, mailbox, market board and direct transfers.
// Items and pawns travel as opaque Scribe XML blobs; the server reads only the descriptor fields.

message SkillBrief {
  string skill_def = 1;
  int32 level = 2;
}

message ItemBlob {
  string def_name = 1;
  string stuff_def = 2;
  int32 count = 3;
  int32 quality = 4;       // -1 when the thing has no quality
  int32 hit_points = 5;
  int32 max_hit_points = 6;
  int64 market_value_x100 = 7;
  string label = 8;
  bytes scribe_xml_zstd = 9;
  bool perishable = 10;    // the thing rots (CompRottable): storage fees apply
}

message PawnBlob {
  string kind_def = 1;
  string name = 2;
  bool humanlike = 3;
  int32 age_years = 4;
  string label = 5;
  repeated SkillBrief skills = 6;
  bytes scribe_xml_zstd = 7;
  // Market value × 100 when sent (0 from older clients); the wealth check counts it as imported.
  int64 market_value_x100 = 8;
}

message ItemList { repeated ItemBlob items = 1; }
message PawnList { repeated PawnBlob pawns = 1; }

enum ParcelKind {
  PARCEL_GIFT = 0;
  PARCEL_PURCHASE = 1;
  PARCEL_LOT_RETURN = 2;
  PARCEL_WITHDRAW = 3;
  PARCEL_ADMIN = 4;
  // Raids (sub-project 3a): stolen goods, surviving raiders, kidnapped colonists.
  PARCEL_LOOT = 5;
  PARCEL_RAID_RETURN = 6;
  PARCEL_CAPTIVE = 7;
  // Safe trades: a refused gift going back, the other side of a completed trade, a side coming back from a trade.
  PARCEL_GIFT_RETURN = 8;
  PARCEL_TRADE = 9;
  PARCEL_TRADE_RETURN = 10;
}

message Parcel {
  int64 id = 1;
  PlayerRef from = 2;          // unset for market returns, withdrawals and admin parcels
  ParcelKind kind = 3;
  ItemList items = 4;
  PawnList pawns = 5;
  int64 silver = 6;
  google.protobuf.Timestamp created_at = 7;
  // The client already delivered this parcel but saved before that: it must drop again.
  bool redeliver = 8;
  int64 delivered_tick = 9;
  int32 size_bytes = 10;
  // A player's gift waiting for Mailbox.Answer: the client does not drop it.
  bool awaiting_decision = 11;
}

message ParcelList { repeated Parcel parcels = 1; }

enum LotStatus {
  LOT_OPEN = 0;
  LOT_SOLD = 1;
  LOT_WITHDRAWN = 2;
  LOT_EXPIRED = 3;
}

message Lot {
  int64 id = 1;
  PlayerRef seller = 2;
  ItemList items = 3;
  PawnBlob pawn = 4;
  int64 price = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  LotStatus status = 8;
}

message LotList {
  repeated Lot lots = 1;
  int32 total = 2;
}

message WalletState {
  int64 balance = 1;
  int64 server_wealth = 2;   // wallet, open lots, open trades and parcels in transit, as the storyteller and the loot cap count them
}

// What the economy window needs to know before asking: forbidden defs and the storage fee.
message EconomyRules {
  repeated string forbidden_defs = 1;
  double storage_fee_percent_per_day = 2;
  double storage_free_days = 3;
}

message WalletEntryMsg {
  int64 id = 1;
  int64 delta = 2;
  string kind = 3;
  int64 ref_id = 4;
  google.protobuf.Timestamp at = 5;
}

message WalletHistory { repeated WalletEntryMsg entries = 1; }

// client_request_id (a client GUID) makes the call idempotent: a repeat returns the first result.
message DepositRequest {
  string client_request_id = 1;
  int64 silver = 2;
  int64 game_tick = 3;
}

message WithdrawRequest {
  string client_request_id = 1;
  int64 silver = 2;
}

message ParcelRef { int64 parcel_id = 1; }
message ParcelAnswer { int64 parcel_id = 1; bool accept = 2; }

message DeliverRequest {
  int64 parcel_id = 1;
  int64 game_tick = 2;
}

message MarketQuery {
  int64 seller_player_id = 1;
  string text = 2;
  int32 page = 3;
}

message PostRequest {
  string client_request_id = 1;
  ItemList items = 2;
  PawnBlob pawn = 3;
  int64 price = 4;
  int64 game_tick = 5;
}

message LotRef { int64 lot_id = 1; }

message TransferRequest {
  string client_request_id = 1;
  int64 to_player_id = 2;
  ItemList items = 3;
  PawnList pawns = 4;
  int64 silver = 5;
  int64 game_tick = 6;
  bool from_caravan = 7;   // things handed over by a caravan, not taken off the home map
}

service Wallet {
  rpc Get (Empty) returns (WalletState);
  rpc Deposit (DepositRequest) returns (WalletState);
  rpc Withdraw (WithdrawRequest) returns (Parcel);
  rpc History (Empty) returns (WalletHistory);
  rpc Rules (Empty) returns (EconomyRules);
}

service Mailbox {
  // Undelivered parcels plus delivered ones the player's current save does not contain yet (redeliver = true).
  // Descriptors only (no blob bytes); Get returns one parcel with its blobs.
  rpc List (Empty) returns (ParcelList);
  rpc Get (ParcelRef) returns (Parcel);
  rpc Deliver (DeliverRequest) returns (Empty);
  // The recipient accepts or refuses a gift awaiting a decision; a refused gift goes back to its sender.
  rpc Answer (ParcelAnswer) returns (Empty);
}

service Market {
  rpc List (MarketQuery) returns (LotList);
  rpc Post (PostRequest) returns (Lot);
  rpc Withdraw (LotRef) returns (Parcel);
  rpc Buy (LotRef) returns (Parcel);
}

service Transfer {
  rpc Send (TransferRequest) returns (Parcel);
}

// Events carried by ServerEvent.
message ParcelArrived { Parcel parcel = 1; }
message LotSold { int64 lot_id = 1; PlayerRef buyer = 2; int64 price = 3; int64 proceeds = 4; int64 storage_fee = 5; }
message LotClosed { int64 lot_id = 1; string reason = 2; int64 storage_fee = 3; }
message WalletChanged { int64 balance = 1; int64 delta = 2; string kind = 3; int64 ref_id = 4; }
// To the sender (a letter) and to the recipient (the parcel leaves its mailbox); expired: nobody answered in time.
message GiftRefused { int64 parcel_id = 1; PlayerRef by = 2; string returned = 3; bool expired = 4; }
