syntax = "proto3";

package rimlink.v1;
option csharp_namespace = "Rimlink.Protocol.V1";

message Empty {}

enum ErrorCode {
  UNSPECIFIED = 0;
  WORLD_NOT_CREATED = 1;
  TILE_TAKEN = 2;
  SETTLEMENT_LIMIT = 3;
  MODPACK_MISMATCH = 4;
  BANNED = 5;
  SERVER_FULL = 6;
  WRONG_PASSWORD = 7;
  PROTOCOL_VERSION = 8;
  NAME_INVALID = 9;
  SAVE_INVALID = 10;
  MUTED = 11;
  // Economy (sub-project 2).
  WALLET_INSUFFICIENT = 12;
  LOT_GONE = 13;
  PARCEL_TOO_BIG = 14;
  DEF_NOT_IN_MODPACK = 15;
  SAVE_STALE = 16;
  RECIPIENT_UNKNOWN = 17;
  ECONOMY_FROZEN = 18;
  SELF_TRADE = 19;
  // Raids and visits (sub-project 3a).
  RAID_COOLDOWN = 20;
  TARGET_PROTECTED = 21;
  PEACEFUL_MODE = 22;
  RAID_ACTIVE = 23;
  RAID_GONE = 24;
  LOOT_OVER_CAP = 25;
  VISITS_CLOSED = 26;
  ITEM_SOLD = 27;
  // Live sessions (3b).
  HOST_OFFLINE = 28;
  LIVE_ACTIVE = 29;
  LIVE_GONE = 30;
  LIVE_DISABLED = 31;
  // Safe trades: blocks, gifts with a decision, two-way trades.
  BLOCKED = 32;
  TRADES_CLOSED = 33;
  TRADE_GONE = 34;
  TRADE_CHANGED = 35;
  TRADE_LIMIT = 36;
  // Modpack join (sub-project modpack-join): a mod settings set the admin uploaded was refused (size, mod not in the
  // modpack, mod loaded before Rimlink).
  MODPACK_CONFIGS_INVALID = 37;
  // Integrity: this player's economy is frozen (an admin, a dev-mode save or a wealth jump); deliveries to them go on.
  PLAYER_FROZEN = 38;
  // Economy hardening.
  UNDER_THREAT = 39;   // a raid or a live raid is on the player: deposits, lots and sends wait
  IN_DEBT = 40;        // storage fees owed: buying, lots and sends wait
  DEF_FORBIDDEN = 41;  // the admin forbade this def in sends and lots
}

// Attached to failed calls as the "rimlink-error-bin" trailer.
message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  // Keyed string the client shows in the player's language ("Live.OwnSession" → Rimlink.Refusal.Live.OwnSession); empty from older servers.
  string key = 3;
  // The keyed string's arguments in order (names, numbers, dates as text).
  repeated string args = 4;
}

message PlayerRef {
  int64 player_id = 1;
  string name = 2;
  string faction_name = 3;
  uint32 color_argb = 4;
}

// A mod as the client reports it: ModMetaData.packageId + modVersion.
message ModRef {
  string package_id = 1;
  string version = 2;
  // Place in the client's load order (0 = first).
  int32 position = 3;
  // Hash of the mod's Defs/Patches/Assemblies files (ModContent.Scan); empty = an older client, content unknown.
  string files_hash = 4;
  bool has_defs = 5;
  bool has_patches = 6;
  bool has_assemblies = 7;
}

// The settings file one Mod class of a running mod uses: handle = the class name, hash = lower-case hex SHA-256 of the
// file in effect, or "none" when the mod has not written one.
message ModSettingsHash {
  string package_id = 1;
  string handle = 2;
  string hash = 3;
}
