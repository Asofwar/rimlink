syntax = "proto3";

package rimlink.v1;
option csharp_namespace = "Rimlink.Protocol.V1";

import "common.proto";
import "modpack.proto";

service Auth {
  rpc Login (LoginRequest) returns (LoginReply);
  // Only when the server enables password accounts (Auth:AllowPassword).
  rpc Register (RegisterRequest) returns (LoginReply);
  rpc Logout (Empty) returns (Empty);
}

enum Role {
  PLAYER = 0;
  MODERATOR = 1;
  ADMIN = 2;
}

message PasswordCredential {
  string login = 1;
  string password = 2;
}

message LoginRequest {
  int32 protocol_version = 1;
  oneof credential {
    bytes steam_ticket = 2;
    PasswordCredential password = 3;
  }
  string server_password = 4;
  repeated ModRef mods = 5;
}

message RegisterRequest {
  string login = 1;
  string password = 2;
  string player_name = 3;
  // Registration logs the new account in, so it is checked against the modpack like a login.
  repeated ModRef mods = 4;
}

message LoginReply {
  string session_token = 1;
  PlayerRef player = 2;
  Role role = 3;
  bool world_exists = 4;
  bool has_save = 5;
  bool has_settlement = 6;
  // Set (with an empty session_token) when the client's mods do not match the server modpack.
  ModpackDiff modpack_diff = 7;
}
