syntax = "proto3";

package rimlink.v1;
option csharp_namespace = "Rimlink.Protocol.V1";

import "common.proto";
import "google/protobuf/timestamp.proto";

service World {
  // Admin only, once: the planet's generation parameters. Every client generates the same planet from them.
  rpc Create (CreateWorldRequest) returns (WorldInfo);
  rpc Get (Empty) returns (WorldInfo);
  rpc ListObjects (Empty) returns (WorldObjects);
  rpc Settle (SettleRequest) returns (WorldObject);
  rpc Abandon (AbandonRequest) returns (Empty);
  rpc GetOutpostManifestBinding (Empty) returns (OutpostManifestBinding);
  rpc StageOutpostManifest (OutpostManifestChunk) returns (ManifestPreview);
  rpc ReadOutpostManifest (OutpostManifestPageRequest) returns (OutpostManifestPage);
  rpc ConfirmOutpostManifest (OutpostManifestConfirmation) returns (ManifestRevision);
  rpc PreviewOutpostManifestConfirmation (OutpostManifestAdminPreviewRequest) returns (OutpostManifestAdminPreview);
}

message WorldParams {
  string seed = 1;
  float planet_coverage = 2;
  int32 rainfall = 3;
  int32 temperature = 4;
  int32 population = 5;
  float pollution = 6;
  string scenario_def = 7;
  string storyteller_def = 8;
  string difficulty_def = 9;
  // Faction defs chosen at world creation; NPC settlement placement depends on them.
  repeated string faction_defs = 10;
  int32 landmark_density = 11;
  // The admin's Difficulty values (Scribe XML, zstd); the only source for a Custom difficulty. Empty for worlds created before it.
  bytes difficulty_values = 12;
}

message CreateWorldRequest {
  WorldParams params = 1;
  // Tiles occupied by NPC settlements on the generating client; players may not settle there.
  repeated int32 npc_tiles = 2;
}

message WorldInfo {
  bool exists = 1;
  WorldParams params = 2;
  repeated int32 npc_tiles = 3;
  // Integrity:StorytellerPolicy = Locked: every colony plays with the storyteller and difficulty above.
  bool storyteller_locked = 4;
  // The four bounds of the wealth tiers 1-5 shown on settlements (Hygiene:WealthTiers), for the inspect text.
  repeated int64 wealth_tiers = 5;
  string world_instance_id = 6;
  string process_instance_id = 7;
}

message WorldObject {
  int64 id = 1;
  string type = 2;
  PlayerRef owner = 3;
  int32 tile = 4;
  string name = 5;
  bytes payload = 6;
  // What other players see of the owner: a wealth tier (0 unknown, 1-5; never the exact wealth), the day of their last
  // activity (UTC midnight; unset if never), and the colony's age in game days from its current save (unset without a save).
  int32 wealth_tier = 7;
  google.protobuf.Timestamp owner_last_seen = 8;
  optional int32 colony_game_days = 9;
}

message WorldObjects {
  repeated WorldObject objects = 1;
}

message SettleRequest {
  int32 tile = 1;
  string name = 2;
}

message AbandonRequest {
  int64 object_id = 1;
}

// Event bodies (ServerEvent 30/31).
message WorldObjectAdded { WorldObject object = 1; }
message WorldObjectRemoved { int64 object_id = 1; }
// The owner's wealth tier or colony age changed (a save upload); sent to everyone but the owner.
message WorldObjectUpdated { WorldObject object = 1; }

// Trusted administrator export, not an independent simulation/anti-cheat proof.
message OutpostManifestBinding {
  string world_instance_id = 1;
  bytes world_params_sha256 = 2;
  bytes server_catalog_sha256 = 3;
}
message OutpostManifestDocument {
  uint32 schema_version = 1;
  OutpostManifestBinding binding = 2;
  string game_version = 3;
  repeated string active_dlc = 4;
  bytes game_defs_sha256 = 5;
  string main_surface_id = 6;
  int32 tile_count = 7;
  repeated OutpostManifestTile tiles = 8;
  string valuation_version = 9;
  repeated OutpostResourceValuation resources = 10;
}
message OutpostManifestTile {
  int32 tile = 1;
  string surface_id = 2;
  string biome_def = 3;
  bool land = 4;
  bool caravan_passable = 5;
  bool natural_trees = 6;
}
message OutpostResourceValuation { string def_name = 1; int64 unit_value_x100 = 2; }
// At most 256 KiB per chunk, 24 MiB per export; upload state is bounded and ephemeral.
message OutpostManifestChunk {
  string upload_id = 1;
  bytes sha256 = 2;
  int32 total_bytes = 3;
  int32 offset = 4;
  bytes data = 5;
}
message ManifestPreview {
  string manifest_id = 1;
  string digest = 2;
  int64 revision = 3;
  bool complete = 4;
  int32 received_bytes = 5;
  OutpostManifestBinding binding = 6;
  string main_surface_id = 7;
  int32 tile_count = 8;
  bytes game_defs_sha256 = 9;
  repeated string active_dlc = 10;
  string valuation_version = 11;
  repeated OutpostResourceValuation resources = 12;
}
message OutpostManifestPageRequest { string manifest_id = 1; string expected_digest = 2; int32 offset = 3; }
message OutpostManifestPage { bytes data = 1; int32 total_bytes = 2; string digest = 3; }
message OutpostManifestConfirmation {
  string manifest_id = 1; string expected_digest = 2;
  bytes canonical_command = 3; bytes intent_sha256 = 4; bool confirmed = 5;
}
message OutpostManifestAdminPreviewRequest {
  string manifest_id = 1; string expected_digest = 2; string client_request_id = 3; string reason = 4;
}
message OutpostManifestAdminPreview {
  bytes canonical_command = 1; bytes intent_sha256 = 2; repeated string blockers = 3;
  string manifest_id = 4; string digest = 5; int64 revision = 6;
}
message ManifestRevision {
  string manifest_id = 1; string digest = 2; int64 revision = 3;
  string command_receipt_id = 4; string authority_head_id = 5; bytes authority_head_sha256 = 6; bool replay = 7;
}
